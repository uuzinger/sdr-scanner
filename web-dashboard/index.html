<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SDR Scanner Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f0f14;
    --panel: #1e1e28;
    --grid: #32323c;
    --text: #c8c8c8;
    --accent: #00ff96;
    --chart: #ff6496;
    --blue: #64c8ff;
    --dim: #969696;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "DejaVu Sans Mono", "Consolas", monospace;
    padding: 16px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
  }
  .col {
    background: var(--panel);
    border-radius: 6px;
    padding: 16px;
    min-height: 460px;
  }
  h2 {
    margin: 0 0 12px 0;
    font-size: 18px;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--grid);
    padding-bottom: 8px;
  }
  .col1 h2 { color: var(--accent); }
  .col2 h2 { color: var(--chart); }
  .col3 h2 { color: var(--blue); }

  .stat-row { display: flex; justify-content: space-between; font-size: 16px; margin: 6px 0; }
  .stat-label { color: var(--dim); }

  .chart-label { color: var(--dim); font-size: 12px; margin: 14px 0 6px 0; }
  canvas.chart-box { background: #1e1e28; border-radius: 3px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--dim); font-weight: normal; font-size: 12px; padding-bottom: 6px; }
  td { padding: 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td.tg { color: var(--chart); }
  td.alias { max-width: 180px; overflow: hidden; text-overflow: ellipsis; }

  .log-line {
    font-size: 12px;
    line-height: 1.5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .status {
    position: fixed;
    top: 8px;
    right: 16px;
    font-size: 11px;
    color: var(--dim);
  }
  .status.stale { color: #ff6464; }
</style>
</head>
<body>

<div class="status" id="conn-status">connecting…</div>

<div class="grid">
  <div class="col col1">
    <h2>SYSTEM HEALTH</h2>
    <div class="stat-row"><span class="stat-label">CPU</span><span id="cpu">--%</span></div>
    <div class="stat-row"><span class="stat-label">MEM</span><span id="mem">--%</span></div>
    <div class="stat-row"><span class="stat-label">NET RX</span><span id="net-rx">-- KB/s</span></div>
    <div class="stat-row"><span class="stat-label">NET TX</span><span id="net-tx">-- KB/s</span></div>
    <div class="chart-label">CPU LOAD HISTORY</div>
    <canvas id="cpuChart" class="chart-box" height="140"></canvas>
  </div>

  <div class="col col2">
    <h2>RECENT ACTIVITY</h2>
    <table>
      <thead><tr><th>TG</th><th>ALIAS</th><th>FREQ</th></tr></thead>
      <tbody id="recent-calls"></tbody>
    </table>
    <div class="chart-label">TRAFFIC VOLUME (LAST 2 MIN)</div>
    <canvas id="trafficChart" class="chart-box" height="140"></canvas>
  </div>

  <div class="col col3">
    <h2>LIVE LOG STREAM</h2>
    <div id="log-stream"></div>
  </div>
</div>

<script>
const POLL_MS = 1000;
let lastGoodUpdate = Date.now();

const cpuCtx = document.getElementById('cpuChart').getContext('2d');
const cpuChart = new Chart(cpuCtx, {
  type: 'line',
  data: {
    labels: Array(60).fill(''),
    datasets: [{
      data: Array(60).fill(0),
      borderColor: getComputedStyle(document.documentElement).getPropertyValue('--accent'),
      borderWidth: 1.5,
      pointRadius: 0,
      tension: 0.2,
      fill: false,
    }]
  },
  options: {
    animation: false,
    responsive: true,
    scales: {
      x: { display: false },
      y: { min: 0, max: 100, grid: { color: '#32323c' }, ticks: { color: '#969696' } }
    },
    plugins: { legend: { display: false } }
  }
});

const trafficCtx = document.getElementById('trafficChart').getContext('2d');
const trafficChart = new Chart(trafficCtx, {
  type: 'bar',
  data: {
    labels: Array(60).fill(''),
    datasets: [{
      data: Array(60).fill(0),
      backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--chart'),
    }]
  },
  options: {
    animation: false,
    responsive: true,
    scales: {
      x: { display: false },
      y: { display: false, beginAtZero: true }
    },
    plugins: { legend: { display: false } }
  }
});

function renderRecentCalls(calls) {
  const tbody = document.getElementById('recent-calls');
  tbody.innerHTML = '';
  calls.forEach(c => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="tg">${c.tg}</td><td class="alias">${c.alias}</td><td>${c.freq}</td>`;
    tbody.appendChild(tr);
  });
}

function renderLogs(logs) {
  const container = document.getElementById('log-stream');
  container.innerHTML = '';
  logs.forEach(line => {
    const div = document.createElement('div');
    div.className = 'log-line';
    div.textContent = line;
    container.appendChild(div);
  });
}

async function poll() {
  const statusEl = document.getElementById('conn-status');
  try {
    const res = await fetch('/api/state');
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();

    document.getElementById('cpu').textContent = data.cpu + '%';
    document.getElementById('mem').textContent = data.mem + '%';
    document.getElementById('net-rx').textContent = data.net_rx_kbps + ' KB/s';
    document.getElementById('net-tx').textContent = data.net_tx_kbps + ' KB/s';

    cpuChart.data.datasets[0].data = data.cpu_history;
    cpuChart.update('none');

    const peak = Math.max(1, ...data.msg_history);
    trafficChart.data.datasets[0].data = data.msg_history;
    trafficChart.options.plugins.title = { display: true, text: `Peak: ${peak} msgs` };
    trafficChart.update('none');

    renderRecentCalls(data.recent_calls);
    renderLogs(data.raw_logs);

    lastGoodUpdate = Date.now();
    statusEl.textContent = data.current_log_path ? 'live · ' + data.current_log_path.split('/').pop() : 'live · waiting for log file';
    statusEl.classList.remove('stale');
  } catch (err) {
    if (Date.now() - lastGoodUpdate > 5000) {
      statusEl.textContent = 'connection lost';
      statusEl.classList.add('stale');
    }
  }
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
